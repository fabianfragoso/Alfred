---
deployment:
  tasks:
    # Copies Alfred into the alfred.fwsolutions.ca subdomain folder,
    # whichever of the two standard cPanel locations it lives in.
    - /bin/bash -c 'for d in "$HOME/alfred.fwsolutions.ca" "$HOME/public_html/alfred.fwsolutions.ca"; do if [ -d "$d" ]; then /bin/cp -R public/. "$d/"; echo "Deployed to $d"; exit 0; fi; done; echo "Subdomain folder not found"; exit 1'
